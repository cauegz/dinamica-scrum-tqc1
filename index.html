<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página da turma TQC1</title>
    <link rel="stylesheet" href="css/abertura_pagina.css">
    <script src="abertura_pagina.js" defer></script>
</head>
<body>
    <section class="abertura-pagina" aria-label="Seção de abertura da página da turma TQC1">
        <div class="abertura-pagina__content">
            <div class="abertura-pagina__text">
                <p class="abertura-pagina__eyebrow">Residência FullStack</p>
                <h1 class="abertura-pagina__title">TQC1<br>Manhã</h1>

                <div class="abertura-pagina__tagline">
                    <p class="abertura-pagina__tagline-text">
                        Códigos que conectam, ideias que transformam.
                    </p>
                </div>

                <a href="#integrantes" class="abertura-pagina__button">Conhecer integrantes</a>
            </div>

            <div class="abertura-pagina__visual" aria-label="Foto da turma">
                <div class="abertura-pagina__photo-wrap">
                    <img
                        class="abertura-pagina__photo"
                        src="images/foto-turma.jpeg"
                        alt="Foto da turma de estudantes"
                    >
                </div>
            </div>
        </div>
    </section>
</body>
</html>
